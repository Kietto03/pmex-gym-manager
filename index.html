<!DOCTYPE html>
<html lang="en" data-style="switch" data-theme="light" data-accent="red">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gym manager for Pokémon Masters EX: members, sync pairs, Pasio Tower and Gym Battle run logs.">
  <title>PMEX Gym Manager</title>
  <link rel="icon" href="https://pomasters.github.io/SyncPairsTracker/images/icon_masterex.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    // Same logic as src/appearance.js, run before the first paint
    (function () {
      var g = function (k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
      var r = document.documentElement, style = g('gym-style', 'switch'), mode = g('gym-theme', 'auto');
      r.dataset.style = style;
      r.dataset.accent = g('gym-accent', 'red'); r.dataset.gb = g('gym-gb', 'green');
      r.dataset.theme = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      r.lang = g('gym-lang', 'en');
      var fonts = { switch: 'family=Nunito:wght@500;600;700;800;900', ds: 'family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@500;600;700;800;900',
        gameboy: 'family=Pixelify+Sans:wght@400..700&family=VT323',
        studio: 'family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600' };
      document.write('<link id="style-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?' + (fonts[style] || fonts.switch) + '&display=swap">');
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=e359fe90">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span id="brand-mascot"></span>
      <span id="brand-name">Gym Manager</span>
      <span id="demo-flag" class="demo-flag" hidden>Demo</span>
    </a>
    <nav id="nav" class="nav" aria-label="Sections"></nav>
    <div class="top-right">
      <span id="userbox"></span>
      <a id="settings-link" class="icon-btn" href="#/settings" aria-label="Settings"></a>
    </div>
    <nav id="subnav" class="subnav" aria-label="Pages" hidden></nav>
  </header>

  <main id="view" class="view"><p class="muted loading">Loading…</p></main>
  <div id="companion" class="companion" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="footer">
    Sync pair data &amp; icons: <a href="https://pomasters.github.io/SyncPairsTracker/" target="_blank" rel="noopener">PoMasters Sync Pairs Tracker</a> ·
    Gym Battle data &amp; sprites: <a id="dex-link" href="https://kietto03.github.io/pmex-supez-dex/" target="_blank" rel="noopener">PMEX Dex</a> ·
    Fan project, not affiliated with Nintendo, DeNA or The Pokémon Company.
  </footer>
