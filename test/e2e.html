<!doctype html>
<meta charset="utf-8">
<title>PMEX Gym Manager — e2e (demo mode)</title>
<!--
  Drives the real UI in demo mode inside an iframe, like a user would.
  Serve the repo root (npm run serve) and open /test/e2e.html.
  Every line must be PASS.
-->
<style>body{font:14px monospace;margin:8px} .PASS{color:#070} .FAIL{color:#b00;font-weight:700} iframe{width:1280px;height:900px;border:1px solid #999}</style>
<pre id="out">running…</pre>
<iframe id="f"></iframe>
<script>
const out = [], f = document.getElementById('f');
// ?dex=<url> tests against a local Dex build (serve it with `npm run serve` in the Dex repo)
const dex = new URLSearchParams(location.search).get('dex');
f.src = '../index.html?demo' + (dex ? '&dex=' + encodeURIComponent(dex) : '');
const log = (ok, name, info = '') => { out.push(`${ok ? 'PASS' : 'FAIL'}  ${name}${info ? '  → ' + info : ''}`); document.getElementById('out').textContent = out.join('\n') + '\n…'; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const W = () => f.contentWindow, $ = s => W().document.querySelector(s), $$ = s => [...W().document.querySelectorAll(s)];
async function until(fn, ms = 4000) { const t = Date.now(); while (Date.now() - t < ms) { try { const v = fn(); if (v) return v; } catch {} await sleep(50); } return null; }
const go = async hash => { W().location.hash = hash; await sleep(250); };
const setVal = (el, v) => { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); };
const text = () => W().document.getElementById('view').innerText;

f.onload = async () => {
  try {
    // 1. Login as the demo member first
    const btn = await until(() => $$('[data-demo]').length === 3 && $$('[data-demo]'));
    log(!!btn, 'login page offers admin / mod / member demo accounts');
    btn[2].click();
    log(!!await until(() => $('.kpis')), 'member lands on the dashboard');
    log(!!$('.progress tbody tr.active'), 'progress matrix highlights the open round');
    log(!$('#nav a[href="#/admin"]'), 'member does not see the admin menu');
    const hash0 = W().location.hash;
    log(!$('#companion').hidden && /ace-directions/.test($('.m-dir').style.backgroundImage) && !!$('#brand-mascot .m-head'), 'trainer companion (Kai) + logo from the page-mascot sheets');
    $('#companion .m-btn').click(); await sleep(250);
    log($('.m-say').classList.contains('show') && $('.m-say p').textContent.length > 0 && $('.m-react').style.opacity === '1' && W().location.hash === hash0,
      'poking the mascot shows a reaction and a speech card', $('.m-say p').textContent);
    log($$('.mb').length > 0 && $$('.mb .pi').length > 0, 'member sees their planned battles with the team', `${$$('.mb').length} leaders`);
    log($$('.hero .stand .spr').length > 0 && $$('.hero .stand .spr').every(i => /assets\/trainers\//.test(i.src)), 'Gym Leaders use their own trainer sprites');

    // 2. Member logs a run with a team
    await go('#/log');
    await until(() => $('#run-editor'));
    const plannedLp = $('.lp .plan-dot')?.closest('.lp');
    plannedLp.click(); await sleep(80);
    log(!!$('.planned') && $$('.slot').length > 0, 'picking an assigned leader fills in the planned team', `${$$('.slot').length} pairs`);
    const open = $$('.lp:not(.full)')[0];
    open.click(); await sleep(80);
    const leader = $('.lp.on b').textContent;
    log(getComputedStyle($('#run-form')).position !== 'sticky', 'log form scrolls with the page (not pinned)');
    const hint = $('input[name=score]').parentElement.querySelector('small').textContent;
    const missing = +hint.replace(/.*· /, '').replace(/[^\d]/g, '');
    setVal($('input[name=score]'), String(missing + 1));
    // The form pre-fills the member's last team; free a slot so we can pick a pair
    while (!$('#team-search')) { $('[data-f-drop]').click(); await sleep(60); }
    log($$('.slot').length < 3, 'team pre-filled from the last run, slots can be freed');
    const search = $('#team-search');
    search.focus(); setVal(search, '');
    await until(() => $$('[data-f-add]').length);
    $('[data-f-add]').click(); await sleep(80);
    $('#run-editor').requestSubmit(); await sleep(200);
    log(/Over the cap/.test($('#run-err').textContent), 'score over the round cap is refused', $('#run-err').textContent);
    setVal($('input[name=score]'), String(Math.min(missing, 1234)));
    const before = $$('#log-table tbody tr').length;
    $('#run-editor').requestSubmit();
    await until(() => $$('#log-table tbody tr').length === before + 1);
    log($$('#log-table tbody tr').length === before + 1, 'valid run is saved and listed', leader);
    log(/1,234/.test($('#log-table tbody tr').innerText), 'history shows the new score at the top');
    const t2 = $('[data-f-tickets="1"]');
    log(!t2 || t2.disabled || !/Circuit/.test($('select[name=round] option:checked').textContent), 'regular circuits lock tickets to ×3');

    // 3. Member edits own pairs and tower
    await go('#/account');
    log(/Change password/.test(text()), 'account page (English by default)');
    const meLink = $('#userbox .user').getAttribute('href');
    await go(meLink);
    await until(() => $('#own-search'));
    const count0 = $$('.owned').length;
    setVal($('#own-search'), 'cynth');
    await until(() => $$('[data-own-add]').length);
    $('[data-own-add]').click();
    await until(() => $$('.owned').length === count0 + 1);
    log($$('.owned').length === count0 + 1, 'member adds an owned pair');
    // Cards re-sort by strength after a change, so follow the pair by id
    const order = () => $$('.owned').map(x => x.dataset.pair).join();
    const order0 = order();
    const pid = $$('.owned').find(c => c.dataset.stars === '5').dataset.pair;
    $(`.owned[data-pair="${pid}"] [data-tile]`).click(); await sleep(150);
    log(!!$('.tile.open .pop') && !!$('.tile.open .cap'), 'a pair is one tile (level under the icon); clicking opens its editor');
    const exBtn = () => $('.tile.open .tog[data-k=ex]');
    const was = exBtn().classList.contains('on');
    exBtn().click(); await sleep(150);
    log(exBtn().classList.contains('on') !== was, 'toggle EX on an owned pair');
    log(order() === order0, 'tiles stay in place after a toggle (no jumping)');

    // A pair below 5★: raise the stars first, only then 6★ EX
    const lowId = $$('.owned').find(c => +c.dataset.stars < 5).dataset.pair;
    const lowCard = () => $(`.owned[data-pair="${lowId}"]`);
    lowCard().querySelector('[data-tile]').click(); await sleep(150);
    const exLow = () => lowCard().querySelector('.tog[data-k=ex]');
    log(exLow().disabled, 'EX is locked while a pair is below 5★');
    lowCard().querySelector('[data-own-star="5"]').click(); await sleep(150);
    log(!exLow().disabled && lowCard().querySelectorAll('.stars .on').length === 5, 'raising to 5★ unlocks EX');
    exLow().click(); await sleep(150);
    log(exLow().classList.contains('on') && /_EX\.png$/.test(lowCard().querySelector('.pi').src), 'EX on shows the EX icon', lowCard().querySelector('.pi').src.split('/').pop());
    lowCard().querySelector('[data-own-star="5"]').click(); await sleep(150);
    log(!exLow().classList.contains('on') && exLow().disabled, 'dropping below 5★ removes EX again');
    W().document.body.click(); await sleep(120);
    log(!$('.tile.open'), 'clicking outside closes the editor');

    // EX Role does not depend on 6★ EX
    W().document.body.click(); await sleep(100);
    for (const id of $$('.owned').map(c => c.dataset.pair).slice(0, 80)) {
      $(`.owned[data-pair="${id}"] [data-tile]`).click(); await sleep(50);
      const b = $('.tile.open .tog[data-k=ex_role]'), ex = $('.tile.open .tog[data-k=ex]');
      if (b && ex && !ex.classList.contains('on') && !b.classList.contains('on')) {
        log(!b.disabled, 'EX Role button is enabled while 6★ EX is off');
        b.click(); await sleep(200);
        log(/EXR/.test($(`.owned[data-pair="${id}"] .cap`)?.textContent || '') && !$(`.owned[data-pair="${id}"] .tog[data-k=ex]`).classList.contains('on'), 'EX Role can be on without 6★ EX');
        break;
      }
    }
    W().document.body.click(); await sleep(100);

    // Filters
    const all = $$('.owned').length;
    $('.tchip').click(); await sleep(120);
    const ty = $('.tchip.on').title;
    log($$('.owned').length < all && $$('.group-h').length === 1, 'type filter narrows the roster', `${all} → ${$$('.owned').length} (${ty})`);
    $('[data-preset]').click(); await sleep(120);
    log($$('.owned').length === all, 'clear filters shows everything again');
    $('[data-mtab=tower]').click(); await sleep(150);
    const tile = ty => [...$$('.tw')].find(x => x.querySelector(`[data-tower=${ty}]`));
    const range = await until(() => $('input[type=range][data-tower=Dragon]'));
    setVal(range, '40'); await sleep(250);
    log(tile('Dragon').querySelector('.tw-n').value === '40', 'tower floor saved to 40 with the slider');
    // Click the number and type a floor instead of dragging
    const num = () => tile('Dragon').querySelector('.tw-n');
    setVal(num(), '17'); await sleep(300);
    log(num().value === '17' && tile('Dragon').querySelector('input[type=range]').value === '17', 'typing a floor number saves it and moves the slider', num().value);
    setVal(num(), '99'); await sleep(300);
    log(num().value === '40', 'a floor above 40 is limited to 40', num().value);
    setVal(num(), '-5'); await sleep(300);
    log(num().value === '0', 'a negative floor becomes 0', num().value);
    setVal(num(), '40'); await sleep(300);

    // 4. Member cannot edit someone else
    await go('#/members');
    const other = [...$$('.mname')].find(a => a.getAttribute('href') !== meLink);
    await go(other.getAttribute('href'));
    log(!$('#own-search') && /View only/.test(text()), 'another member\'s profile is read-only');
    await go('#/roster');
    await until(() => $('.troster'));
    const editable = $$('.troster tbody tr').filter(tr => tr.querySelector('[data-sc]'));
    log(editable.length === 1 && editable[0].classList.contains('me'), 'member can only edit their own row of the roster sheet');

    // 5. Sign out → sign in as admin
    await go('#/account');
    $('[data-signout]').click();
    const btn2 = await until(() => $$('[data-demo]').length === 3 && $$('[data-demo]'));
    btn2[0].click();
    await until(() => $('.kpis'));
    log(!!$('#nav a[href="#/admin"]'), 'admin sees the admin menu');

    // Settings: language, style, mode
    await go('#/settings');
    setVal(W().document.getElementById('lang'), 'vi'); await sleep(200);
    log(/Tổng quan/.test(W().document.getElementById('nav').innerText), 'switching to Vietnamese translates the menu');
    setVal(W().document.getElementById('lang'), 'en'); await sleep(200);
    log(/Overview/.test(W().document.getElementById('nav').innerText), 'and back to English');
    const root = W().document.documentElement;
    $('[data-set-style=ds]').click(); await sleep(150);
    log(root.dataset.style === 'ds' && $('[data-set-style=ds]').classList.contains('on'), 'settings: switch the style to DS');
    $('[data-set-mode=dark]').click(); await sleep(100);
    $('[data-set-accent=blue]').click(); await sleep(100);
    log(root.dataset.theme === 'dark' && root.dataset.accent === 'blue', 'settings: dark mode and a blue accent');
    $('[data-set-mascot=momo]').click(); await sleep(150);
    log(/ranger(-pixel)?-directions/.test($('.m-dir').style.backgroundImage) && /ranger/.test($('#brand-mascot .m-head').style.backgroundImage), 'settings: switch the mascot to Momo');
    $('[data-set-mstyle=pixel]').click(); await sleep(150);
    log(/ranger-pixel-directions/.test($('.m-dir').style.backgroundImage) && $('#companion').classList.contains('pixel'), 'settings: pixel style of the mascot');
    $('[data-set-mstyle=auto]').click(); await sleep(100);
    $('[data-set-mascot=off]').click(); await sleep(150);
    log($('#companion').hidden, 'settings: turn the mascot off');
    $('[data-set-mascot=kai]').click(); await sleep(150);
    $('[data-set-style=switch]').click(); $('[data-set-mode=light]').click(); $('[data-set-accent=red]').click(); await sleep(100);

    // 6. Plan page renders every leader with suggestions
    await go('#/plan');
    await until(() => $$('.plan').length);
    log($$('.plan').length >= 1 && $$('.plan .fit').length > 0, 'plan: leader cards with best-fit members', `${$$('.plan').length} cards`);
    log($$('.heatmap .heat').length > 0, 'plan: weakness coverage matrix');

    // 6b. Admin assigns a member to a leader and picks the team from that member's roster
    const card = $$('.plan')[1];
    const addSel = card.querySelector('[data-asg-add]');
    const adminId = $('#userbox .user').getAttribute('href').split('/').pop();
    const who = [...addSel.options].find(o => o.value && o.value !== adminId).value;
    const rows0 = card.querySelectorAll('.sq').length;
    setVal(addSel, who);
    await until(() => $('.sq-edit'));
    const openCard = $$('.plan')[1];
    log(openCard.querySelectorAll('.sq').length === rows0 + 1 && !!$('.sq-edit'), 'admin assigns a member; the roster picker opens');
    const inTeam = () => $$('.sq.open .slots3 .pi').length;
    const n0 = inTeam();
    const onBtn = $('.rp.on');
    if (onBtn) { onBtn.click(); await until(() => inTeam() === n0 - 1); }
    const n1 = inTeam();
    const pick = $('.rp:not(.on)');
    pick.click(); await until(() => inTeam() === n1 + 1);
    log(inTeam() === n1 + 1 && $$('.rp.on').length === inTeam(), 'admin picks sync pairs from that member\'s own roster', `${n0} → ${inTeam()}`);
    $('[data-asg-done]').click(); await sleep(150);
    await go(`#/member/${who}/plan`);
    await until(() => $('.sq'));
    log($$('.sq').length >= 1 && /Battle plan/.test(text()), 'member profile shows their battle plan');
    await go(`#/member/${who}/pairs`);
    await until(() => $('#own-search'));
    log(!!$('.manage') && !!$('#own-search') && !$('.owned select[disabled]'), 'admin can edit another member\'s roster');

    // 6c. Roster sheet (admin can edit every row)
    await go('#/roster');
    await until(() => $('.troster'));
    log(!!$('#nav a[href="#/roster"]'), 'Roster has its own menu entry');
    $('[data-rtype=Poison]').click(); await sleep(200);
    const heads = $$('.troster thead th').map(th => th.innerText.trim().replace(/\s+/g, ' '));
    log(['Special', 'Physical', 'EX WTZ', 'Rebuff', 'Gloria', 'R96', 'Support', 'Other 1'].every(h => heads.some(x => x.includes(h))) && !$('[data-core-edit]') && !$('[data-col-edit]'),
      'sheet columns: Special, Physical, EX WTZ, Rebuff, Gloria, R96, Support, Other — no core / column buttons', heads.slice(2).join(' | '));
    log($$('.troster tbody tr').length >= 19 && $$('.troster tbody tr').every(tr => tr.querySelector('[data-sc]')), 'admin can edit every row');
    const cellKey = $$('[data-sc$="|support"]')[0].dataset.sc;
    const cell = () => $(`[data-sc="${cellKey}"]`);
    cell().click(); await sleep(200);
    log(!!$('.sc-pick'), 'clicking a cell opens the pair picker');
    $('[data-sc-none]').click(); await sleep(250);
    log(!!cell().querySelector('.nope'), 'mark a cell as none (✕)');
    cell().click(); await sleep(200);
    $('[data-sc-all]').click(); await sleep(200);
    $('.sc-list button:not(:disabled)').click(); await sleep(250);
    log(!!cell().querySelector('.tc'), 'pick a pair from the member’s roster for the cell');
    cell().click(); await sleep(200);
    $('[data-sc-clear]').click(); await sleep(250);
    log(!!cell().querySelector('.sc-add'), 'clear a cell');
    W().confirm = () => true;
    $('[data-sheet-fill]').click(); await sleep(300);
    log($$('.sc-add').length < $$('[data-sc]').length, 'auto-fill fills empty cells with matching pairs');
    W().document.body.click(); await sleep(100);

    // 7. Admin creates and deletes an account
    await go('#/admin');
    await until(() => $('[data-atab=accounts]'));
    $('[data-atab=accounts]').click();
    const af = await until(() => $('#account-form'));
    setVal(af.username, 'newbie'); setVal(af.display_name, 'Newbie');
    af.requestSubmit();
    await until(() => /newbie/.test(text()));
    log(/Send this to/.test(text()) && /newbie/.test(text()), 'admin creates an account and gets the hand-off text');
    W().prompt = () => 'newbie';
    const del = [...$$('[data-deluser]')].find(b => b.closest('tr').innerText.includes('@newbie'));
    del.click();
    await until(() => !/@newbie/.test(text()));
    log(!/@newbie/.test(text()), 'admin deletes the account');

    // 8. Admin creates a season from the datamine gym
    $('[data-atab=seasons]').click();
    const sf = await until(() => $('#season-form'));
    log(!!sf.battle_start.value && !!sf.name.value, 'season form prefilled from the newest datamine gym', sf.name.value);
    setVal(sf.name, 'E2E Season');
    sf.is_active.checked = false;
    sf.requestSubmit();
    await until(() => /E2E Season/.test(text()));
    log(/E2E Season/.test(text()), 'season created');

    // 9. Activity log
    $('[data-atab=activity]').click();
    await until(() => $$('#admin-body tbody tr').length > 1);
    log($$('#admin-body tbody tr').length > 1, 'activity log lists actions');
  } catch (e) { log(false, 'crashed', e.stack); }
  document.getElementById('out').textContent = out.join('\n') + `\n\n${out.filter(l => l.startsWith('FAIL')).length} failed / ${out.length}`;
};
</script>
