name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"   # rebuild every 6 hours so the data synced below stays fresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh data from the community sheets
        # Each tool keeps the copy already in the repo when its source cannot be read or has changed shape.
        run: |
          node tools/sync-gems.mjs || echo "::warning::Gems sheet not refreshed, keeping the committed copy"
          node tools/sync-ranking.mjs || echo "::warning::D.C ranking not refreshed, keeping the committed copy"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
